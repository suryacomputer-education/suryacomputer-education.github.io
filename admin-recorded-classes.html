<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recorded Video Classes - Admin</title>

    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48.png">

    <script src="assets/js/backend-config.js"></script>
    <script src="assets/js/admin-guard.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            background: #0d47a1;
            color: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            opacity: .9;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .panel h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .source-help {
            margin-top: 5px;
            font-size: 13px;
            color: #64748b;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        .save-btn {
            background: #0d47a1;
            color: white;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        .msg {
            margin-top: 15px;
            font-weight: 700;
        }

        .video-card {
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            background: #fff;
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .meta {
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #e2e8f0;
        }

        .video-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .watch-btn {
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .page {
                margin: 10px auto;
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
<link rel="stylesheet" href="assets/css/project-ui.css">
<link rel="stylesheet" href="assets/css/dark-mode-fix.css">
<script src="assets/js/surya-format.js"></script>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>🎥 Recorded Video Classes</h1>
        <p>Recorded classes add, publish और manage करें।</p>
    </div>


    <!-- FORM -->

    <div class="panel">

        <h2>🎬 Add / Edit Recorded Class</h2>

        <div class="grid">

            <div class="field">
                <label for="videoId">Video ID</label>
                <input
                    id="videoId"
                    type="text"
                    readonly
                    placeholder="New video के लिए खाली">
            </div>


            <div class="field">
                <label for="videoTitle">Video Title</label>
                <input
                    id="videoTitle"
                    type="text"
                    placeholder="जैसे: Computer Fundamentals Chapter 1">
            </div>


            <div class="field">
                <label for="videoCourse">Course</label>
                <input
                    id="videoCourse"
                    type="text"
                    placeholder="जैसे: DCA — सभी के लिए खाली">
            </div>


            <div class="field">
                <label for="videoSubject">Subject</label>
                <input
                    id="videoSubject"
                    type="text"
                    placeholder="जैसे: Computer Fundamentals">
            </div>


            <div class="field full">
                <label for="videoDescription">Description</label>
                <textarea
                    id="videoDescription"
                    placeholder="इस recorded class के बारे में जानकारी"></textarea>
            </div>


            <div class="field">
                <label for="sourceType">Video Source</label>

                <select id="sourceType">
                    <option value="Google Drive">Google Drive</option>
                    <option value="YouTube">YouTube</option>
                </select>
            </div>


            <div class="field">
                <label for="videoUrl">Video URL</label>

                <input
                    id="videoUrl"
                    type="url"
                    placeholder="Google Drive या YouTube URL">

                <div class="source-help">
                    Google Drive में video की sharing
                    <strong>Anyone with the link - Viewer</strong>
                    होनी चाहिए।
                </div>
            </div>


            <div class="field">
                <label for="driveFileId">Google Drive File ID</label>

                <input
                    id="driveFileId"
                    type="text"
                    placeholder="केवल Drive के लिए — URL से भी निकाला जाएगा">
            </div>


            <div class="field">
                <label for="videoStatus">Status</label>

                <select id="videoStatus">
                    <option value="Draft">Draft</option>
                    <option value="Published">Published</option>
                </select>
            </div>

            <div class="field">
                <label for="videoAccessMode">Access Mode</label>
                <select id="videoAccessMode">
                    <option value="FREE">FREE — सब students</option>
                    <option value="PAID">PAID — payment required</option>
                </select>
            </div>

        </div>


        <div class="buttons">

            <button
                type="button"
                class="save-btn"
                onclick="saveRecordedVideo()">
                💾 Save
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="clearRecordedForm()">
                🧹 Clear
            </button>

        </div>

        <div id="msg" class="msg"></div>

    </div>


    <!-- LIST -->

    <div class="panel">

        <h2>📚 Recorded Classes List</h2>

        <div id="videoList">
            Loading...
        </div>

    </div>

</div>


<script>

const API = window.SURYA_DATABASE_API;


/* =========================================================
   HELPERS
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


function getAdminToken() {

    return sessionStorage.getItem("SURYA_ADMIN_TOKEN") || "";
}


async function api(payload) {

    const response = await fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
    });

    const text = await response.text();

    let data;

    try {
        data = JSON.parse(text);
    } catch (e) {
        throw new Error("Invalid server response.");
    }

    if (!data.success) {
        throw new Error(
            data.message || "Request failed."
        );
    }

    return data;
}


/* =========================================================
   SAVE
   ========================================================= */

async function saveRecordedVideo() {

    const token = getAdminToken();

    if (!token) {
        $("msg").textContent =
            "❌ Admin login required.";
        return;
    }


    const data = {

        videoId: $("videoId").value.trim(),

        title: $("videoTitle").value.trim(),

        course: $("videoCourse").value.trim(),

        subject: $("videoSubject").value.trim(),

        description: $("videoDescription").value.trim(),

        sourceType: $("sourceType").value,

        videoUrl: $("videoUrl").value.trim(),

        driveFileId: $("driveFileId").value.trim(),

        status: $("videoStatus").value,
        accessMode: $("videoAccessMode").value
    };


    if (!data.title) {

        $("msg").textContent =
            "❌ Video title required.";
        return;
    }


    if (!data.videoUrl && !data.driveFileId) {

        $("msg").textContent =
            "❌ Video URL या Drive File ID डालें.";
        return;
    }


    $("msg").textContent =
        "⏳ Saving...";


    try {

        const result = await api({

            action: "recordedSave",

            token: token,

            ...data
        });


        $("msg").textContent =
            "✅ " + result.message;


        clearRecordedForm();

        await loadRecordedVideos();

    } catch (error) {

        $("msg").textContent =
            "❌ " + error.message;
    }
}


/* =========================================================
   LOAD
   ========================================================= */

async function loadRecordedVideos() {

    const token = getAdminToken();

    if (!token) {

        $("videoList").innerHTML =
            '<div class="empty">❌ Admin login required.</div>';

        return;
    }


    $("videoList").textContent =
        "Loading...";


    try {

        const result = await api({

            action: "recordedAdminList",

            token: token
        });


        renderRecordedVideos(
            result.videos || []
        );

    } catch (error) {

        $("videoList").innerHTML =
            '<div class="empty">❌ ' +
            escapeHtml(error.message) +
            '</div>';
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderRecordedVideos(videos) {

    if (!videos.length) {

        $("videoList").innerHTML =
            '<div class="empty">🎥 अभी कोई Recorded Class नहीं है.</div>';

        return;
    }


    $("videoList").innerHTML =
        videos.map(function(video) {

            const title =
                escapeHtml(
                    video["Title"] || ""
                );

            const course =
                escapeHtml(
                    video["Course"] || "All"
                );

            const subject =
                escapeHtml(
                    video["Subject"] || "—"
                );

            const description =
                escapeHtml(
                    video["Description"] || ""
                );

            const source =
                escapeHtml(
                    video["Source Type"] || ""
                );

            const status =
                escapeHtml(
                    video["Status"] || ""
                );

            const url =
                escapeHtml(
                    video["Video URL"] || ""
                );

            const id =
                escapeHtml(
                    video["Video ID"] || ""
                );


            return `
                <div class="video-card">

                    <div class="video-title">
                        🎥 ${title}
                    </div>

                    <div class="meta">

                        🆔 ${id}<br>

                        🎓 Course: ${course}<br>

                        📖 Subject: ${subject}<br>

                        🎬 Source: ${source}<br>

                        🔘 Status:
                        <span class="status">
                            ${status}
                        </span>

                        ${
                            description
                                ? "<br>📝 " + description
                                : ""
                        }

                    </div>


                    <div class="video-actions">

                        ${
                            url
                                ? `
                                <a
                                    class="watch-btn"
                                    href="${url}"
                                    target="_blank"
                                    rel="noopener">
                                    ▶️ Open Video
                                </a>
                                `
                                : ""
                        }


                        <button
                            type="button"
                            class="edit-btn"
                            onclick='editRecordedVideo(${JSON.stringify(video)})'>
                            ✏️ Edit
                        </button>


                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteRecordedVideo('${escapeJs(video["Video ID"] || "")}')">
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   EDIT
   ========================================================= */

function editRecordedVideo(video) {

    $("videoId").value =
        video["Video ID"] || "";

    $("videoTitle").value =
        video["Title"] || "";

    $("videoCourse").value =
        video["Course"] || "";

    $("videoSubject").value =
        video["Subject"] || "";

    $("videoDescription").value =
        video["Description"] || "";

    $("sourceType").value =
        video["Source Type"] || "Google Drive";

    $("videoUrl").value =
        video["Video URL"] || "";

    $("driveFileId").value =
        video["Drive File ID"] || "";

    $("videoStatus").value =
        video["Status"] || "Draft";

    $("videoAccessMode").value =
        String(video["Access Mode"] || "FREE").toUpperCase()==="PAID" ? "PAID" : "FREE";

    $("msg").textContent =
        "✏️ Edit mode: details बदलकर Save करें.";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteRecordedVideo(videoId) {

    if (!confirm(
        "क्या आप इस Recorded Class को delete करना चाहते हैं?"
    )) {
        return;
    }


    const token = getAdminToken();

    try {

        const result = await api({

            action: "recordedDelete",

            token: token,

            videoId: videoId
        });


        $("msg").textContent =
            "✅ " + result.message;


        await loadRecordedVideos();

    } catch (error) {

        $("msg").textContent =
            "❌ " + error.message;
    }
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearRecordedForm() {

    $("videoId").value = "";

    $("videoTitle").value = "";

    $("videoCourse").value = "";

    $("videoSubject").value = "";

    $("videoDescription").value = "";

    $("sourceType").value =
        "Google Drive";

    $("videoUrl").value = "";

    $("driveFileId").value = "";

    $("videoStatus").value =
        "Draft";
    $("videoAccessMode").value = "FREE";
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeJs(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadRecordedVideos
);

</script>

<script src="assets/js/project-ui.js"></script>
</body>
</html>
