<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance | SURYA</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/project-ui.css"><link rel="stylesheet" href="assets/css/dark-mode-fix.css"><style>.att-wrap{max-width:1150px;margin:25px auto;padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar label{display:flex;flex-direction:column;gap:5px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccd4df;border-radius:8px;min-width:150px}.att-table{width:100%;border-collapse:collapse;margin-top:18px}.att-table th,.att-table td{padding:10px;border-bottom:1px solid #e5e9ef;text-align:left}.status{padding:8px;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.panel{margin-top:18px;padding:14px;border:1px solid #e5e9ef;border-radius:12px}.scroll{overflow:auto}.small{font-size:.88rem;opacity:.8}</style><script src="assets/js/surya-format.js"></script>
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
</head><body><main class="att-wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h1>📅 Attendance</h1><p>Daily course-wise attendance management.</p></div><a href="admin.html" class="admin-btn">← Admin Dashboard</a></div><div class="panel"><div class="toolbar"><label>Course<select id="course"><option value="">All Courses</option></select></label><label>Date<input id="date" type="date"></label><button id="load" class="admin-btn" type="button">Load</button></div><div id="holiday" style="margin-top:14px;font-weight:700"></div><div class="toolbar" style="margin-top:14px"><label>Holiday Reason<input id="holidayReason" type="text" placeholder="e.g. Institute Holiday"></label><label>Type<select id="holidayType"><option value="CUSTOM">CUSTOM</option><option value="SUNDAY">SUNDAY</option><option value="HOLIDAY">HOLIDAY</option></select></label><button id="saveHoliday" class="admin-btn" type="button">🏖️ Save Holiday</button></div><div class="small" style="margin-top:8px">Sunday is automatically HOLIDAY. Normal days stay unmarked until saved; they are not silently treated as ABSENT.</div></div><div class="actions"><button id="all" class="admin-btn" type="button">✅ Mark All Present</button><button id="save" class="admin-btn" type="button">💾 Save Attendance</button></div><div class="panel scroll"><table class="att-table"><thead><tr><th>Student</th><th>Course</th><th>Status</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel"><h2>📚 Attendance History</h2><div class="toolbar"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><button id="historyBtn" class="admin-btn" type="button">Load History</button></div><div class="scroll"><table class="att-table"><thead><tr><th>Date</th><th>Student</th><th>Course</th><th>Status</th><th>Reason</th><th>Marked By</th><th>Updated</th></tr></thead><tbody id="historyRows"></tbody></table></div></div><p id="msg"></p></main><script src="assets/js/backend-config.js"></script><script src="assets/js/admin-guard.js"></script><script>
const API=window.SURYA_DATABASE_API,TOKEN=sessionStorage.getItem("SURYA_ADMIN_TOKEN");let DATA=[];const $=id=>document.getElementById(id);function today(){return new Date().toISOString().slice(0,10)}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#039;"}[m]));}$("date").value=today();$("from").value=today();$("to").value=today();
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:TOKEN})});const d=await r.json();if(!d.success)throw new Error(d.message||"Request failed");return d;}
async function courses(){const d=await api({action:"courses"});const list=d.courses||d||[];$("course").innerHTML='<option value="">All Courses</option>'+list.map(c=>{const n=String(c['Course Name']||c.Course||c.name||'');return `<option value="${esc(n)}">${esc(n)}</option>`}).join('');}
function render(){if(!DATA.length){$("rows").innerHTML='<tr><td colspan="4">No active students found for this course.</td></tr>';return;}$("rows").innerHTML=DATA.map((s,i)=>`<tr><td><b>${esc(s.studentName||'')}</b><br><small>${esc(s.studentId||'')}</small></td><td>${esc(s.course||'')}</td><td><select class="status" data-i="${i}" ${s.status==='HOLIDAY'?'disabled':''}><option value="">Not Marked</option><option value="PRESENT">PRESENT</option><option value="ABSENT">ABSENT</option><option value="LATE">LATE</option><option value="EXCUSED">EXCUSED</option></select></td><td>${esc(s.reason||'')}</td></tr>`).join('');document.querySelectorAll('.status').forEach(el=>{el.value=DATA[Number(el.dataset.i)].status||'';el.onchange=()=>{DATA[Number(el.dataset.i)].status=el.value;};});}
async function load(){try{const d=await api({action:"attendanceStudents",course:$("course").value,date:$("date").value});DATA=d.students||[];$("holiday").textContent=d.holiday?'🏖️ HOLIDAY: '+(d.holidayReason||'Holiday'):'✅ Normal working day — unmarked students are NOT automatically absent.';$("holidayReason").value=d.holidayReason&&d.holidayReason!=='Sunday'?d.holidayReason:'';$("holidayType").value=d.holiday?'HOLIDAY':'CUSTOM';render();$("msg").textContent='';}catch(e){$("msg").textContent='❌ '+e.message;}}
async function loadHistory(){try{const d=await api({action:"attendanceHistory",course:$("course").value,from:$("from").value,to:$("to").value});const map={};(d.history||[]).forEach(r=>{(map[r.date]??=[]).push(r);});const rows=d.history||[];$("historyRows").innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.studentId)}</td><td>${esc(r.course)}</td><td>${esc(r.status)}</td><td>${esc(r.reason)}</td><td>${esc(r.markedBy)}</td><td>${esc(r.updatedAt)}</td></tr>`).join(''):'<tr><td colspan="7">No saved attendance in selected range.</td></tr>';}catch(e){$("msg").textContent='❌ '+e.message;}}
$("load").onclick=load;$("historyBtn").onclick=loadHistory;$("all").onclick=()=>{if($("holiday").textContent.startsWith('🏖️'))return;DATA.forEach(x=>x.status='PRESENT');render();};$("save").onclick=async()=>{try{const records=DATA.filter(x=>x.status&&x.status!=='HOLIDAY').map(x=>({studentId:x.studentId,course:x.course,date:$("date").value,status:x.status}));if(!records.length){$("msg").textContent='❌ कोई attendance status select नहीं है.';return;}const d=await api({action:"saveAttendance",records});$("msg").textContent='✅ '+d.message+' Saved: '+d.saved;await load();await loadHistory();}catch(e){$("msg").textContent='❌ '+e.message;}};$("saveHoliday").onclick=async()=>{try{const date=$("date").value,reason=$("holidayReason").value.trim();if(!date){$("msg").textContent='❌ Date is required.';return;}const d=await api({action:"saveAttendanceHoliday",date:date,reason:reason||'Holiday',type:$("holidayType").value});$("msg").textContent='✅ '+d.message;await load();await loadHistory();}catch(e){$("msg").textContent='❌ '+e.message;}};courses().then(async()=>{await load();await loadHistory();}).catch(e=>$("msg").textContent='❌ '+e.message);
</script><script src="assets/js/project-ui.js"></script>
</body></html>
