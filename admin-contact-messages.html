<main class="contact-admin-wrap">
<div class="admin-header"><h2>✉️ Contact Messages</h2><p>Visitor messages पढ़ें और backend से सीधे email reply भेजें.</p></div>
<div class="contact-actions"><button type="button" onclick="loadMessages()">🔄 Refresh</button></div>
<div id="messageStatus"></div>
<div id="messages">Loading...</div>
</main>

<script>
"use strict";
const API=window.SURYA_DATABASE_API;
const TOKEN=sessionStorage.getItem("SURYA_ADMIN_TOKEN");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function formatIndiaTime(v){
 if(!v)return "";
 const d=new Date(v);
 if(isNaN(d.getTime()))return String(v);
 return new Intl.DateTimeFormat("en-IN",{
  timeZone:"Asia/Kolkata",
  day:"2-digit",month:"2-digit",year:"numeric",
  hour:"2-digit",minute:"2-digit",second:"2-digit",
  hour12:true
 }).format(d)+" IST";
}
async function api(body){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:TOKEN})});
 const d=await r.json();if(!d.success)throw new Error(d.message||"Request failed");return d;
}
async function loadMessages(){
 const box=document.getElementById("messages"),status=document.getElementById("messageStatus");
 box.textContent="⏳ Loading...";
 try{
  const d=await api({action:"contactMessages"});
  const arr=d.messages||[];
  if(!arr.length){box.innerHTML="<p>📭 No contact messages.</p>";return;}
  box.innerHTML=arr.map(m=>`
   <article class="message-card">
    <div class="message-meta">
      <strong>👤 ${esc(m.name)}</strong>
      <span class="badge">${esc(m.status)}</span>
    </div>
    <p>✉️ <a href="mailto:${encodeURIComponent(m.email)}">${esc(m.email)}</a></p>
    <small>🕒 ${formatIndiaTime(m.createdAt)}</small>
    <div class="message-body">${esc(m.message)}</div>
    ${m.reply ? `<div class="message-body"><b>↩️ Previous Reply</b><br>${esc(m.reply)}<br><small>${formatIndiaTime(m.repliedAt)}</small></div>` : ""}
    <textarea class="reply-box" id="reply-${esc(m.messageId)}" placeholder="Type reply...">${esc(m.reply||"")}</textarea>
    <div class="contact-actions">
      <button type="button" onclick="sendReply('${encodeURIComponent(m.messageId)}')">📤 Send Reply</button>
      <button type="button" onclick="deleteMessage('${encodeURIComponent(m.messageId)}')">🗑️ Delete</button>
    </div>
   </article>
  `).join("");
  status.textContent="";
 }catch(e){box.textContent="❌ "+e.message;}
}
async function sendReply(encodedId){
 const id=decodeURIComponent(encodedId);
 const area=document.getElementById("reply-"+id);
 if(!area||!area.value.trim()){alert("⚠️ Reply लिखें.");return;}
 if(!confirm("क्या इस visitor को email reply भेजना है?"))return;
 try{const d=await api({action:"replyContactMessage",messageId:id,reply:area.value.trim()});alert("✅ "+d.message);loadMessages();}
 catch(e){alert("❌ "+e.message);}
}
async function deleteMessage(encodedId){
 const id=decodeURIComponent(encodedId);
 if(!confirm("यह message delete करना है?"))return;
 try{const d=await api({action:"deleteContactMessage",messageId:id});alert("✅ "+d.message);loadMessages();}
 catch(e){alert("❌ "+e.message);}
}
loadMessages();
</script>
