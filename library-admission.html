<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Admission | Surya Computer</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><script src="assets/js/backend-config.js"></script>
<style>
.library-wrap{max-width:1100px;margin:34px auto;padding:20px}.library-hero{padding:34px;border-radius:20px;background:var(--card-bg,#fff);box-shadow:0 8px 28px rgba(0,0,0,.08);text-align:center}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}.library-card{padding:22px;border-radius:16px;background:var(--card-bg,#fff);box-shadow:0 6px 22px rgba(0,0,0,.08)}.library-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.library-btn{display:inline-block;padding:12px 18px;border-radius:10px;text-decoration:none;background:#1f4f8f;color:#fff}.library-btn.alt{background:transparent;color:inherit;border:1px solid currentColor}.library-form{max-width:700px;margin:auto;display:grid;gap:12px}.library-form input,.library-form textarea,.library-form select{padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box}.library-status{margin-top:14px;padding:12px;border-radius:10px}.library-table{width:100%;border-collapse:collapse}.library-table th,.library-table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.lock{opacity:.7}
</style>
<link rel="stylesheet" href="assets/css/project-ui.css">
<link rel="stylesheet" href="assets/css/dark-mode-fix.css">
<script src="assets/js/surya-format.js"></script>
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
</head>
<body><header class="site-header"><img src="assets/images/logo.png" alt="Logo" class="logo"><div class="title"><h1>SURYA DIGITAL LIBRARY</h1><p>Library Admission</p></div></header><nav class="navbar"><a href="digital-library.html">Digital Library</a><a href="library-admission.html" aria-current="page">Admission</a><a href="library-login.html">Login</a></nav>
<main class="library-wrap"><section class="library-card"><h2>📚 Digital Library Admission</h2><form id="f" class="library-form"><input name="name" placeholder="Full Name" required><input name="fatherName" placeholder="Father Name"><input name="dateOfBirth" type="date"><input name="mobile" inputmode="numeric" maxlength="10" placeholder="Mobile" required><input name="email" type="email" placeholder="Gmail / Email" required><textarea name="address" placeholder="Address"></textarea><select name="membershipPlan"><option value="Standard">Standard</option><option value="Premium">Premium</option></select><input name="fee" type="number" min="0" step="1" placeholder="Membership Fee (₹)"><button class="library-btn" type="submit">Submit Library Admission</button></form><div id="status"></div></section></main>
<script>
const API=window.SURYA_DATABASE_API; const form=document.getElementById('f'), box=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault(); const fd=new FormData(form), data=Object.fromEntries(fd.entries()); box.className='library-status'; box.textContent='Submitting...'; try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submitLibraryAdmission',...data})}); const d=await r.json(); if(!d.success) throw new Error(d.message||'Submission failed'); box.textContent='✅ Admission submitted. Application ID: '+d.applicationId+'. Approval के बाद Library ID और password registered email पर भेजे जाएंगे.'; form.reset();}catch(err){box.textContent='❌ '+err.message;}});
</script><script src="assets/js/project-ui.js"></script>
</body></html>
