<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surya Digital Library — Mock Test</title>
<link rel="stylesheet" href="assets/css/dark-mode-fix.css">
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:var(--page-bg,#f5f7fb);color:var(--text-color,#172033)}
.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:var(--card-bg,#fff);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.08)}
button,a.btn{display:inline-block;padding:11px 16px;border-radius:10px;border:0;text-decoration:none;background:#1f4f8f;color:#fff;cursor:pointer}.muted{opacity:.75}.opt{display:block;padding:10px;margin:8px 0;border:1px solid #d7dce5;border-radius:10px}.danger{color:#b42318}
</style>
<script src="assets/js/backend-config.js"></script>
<script src="assets/js/surya-format.js"></script><script src="assets/js/project-ui.js"></script>
</head>
<body><main class="wrap"><div class="card"><h1>📝 Digital Library Mock Test</h1><div id="top" class="muted">Loading...</div></div><div id="app"></div></main>
<script>
const API=window.SURYA_DATABASE_API,T=sessionStorage.getItem('SURYA_LIBRARY_TOKEN');
if(!T)location.href='library-login.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function post(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+raw.slice(0,500));try{return JSON.parse(raw);}catch(e){throw new Error('NON-JSON HTTP '+r.status+': '+raw.slice(0,500));}}
async function load(){try{const rawList=await post({action:'libraryPublishedMockTests',token:T});const list=Array.isArray(rawList)?{success:true,tests:rawList}:rawList;if(!list.success)throw new Error(list.message||'Session expired');const id=new URLSearchParams(location.search).get('testId');if(id)return start(id,list.tests||[]);const app=document.getElementById('app');app.innerHTML=(list.tests||[]).map(t=>{const paid=t.accessMode==='PAID',unlock=t.accessState==='UNLOCKED';return '<div class="card"><h2>'+esc(t.Title)+'</h2><div>'+esc(t.Course)+' — '+esc(t['Subject Name'])+'</div><p>⏱ '+esc(t.Duration)+' min • 📝 '+esc(t['Total Marks'])+' marks • '+(paid?(unlock?'✅ Paid access unlocked':'🔒 Paid — membership payment required'):'🟢 Free')+'</p>'+(paid&&!unlock?'':'<a class="btn" href="library-mock-test.html?testId='+encodeURIComponent(t['Test ID'])+'">Start Test</a>')+'</div>';}).join('')||'<div class="card">No published library mock tests.</div>';}catch(e){document.getElementById('app').innerHTML='<div class="card danger">❌ '+esc(e.message)+'</div>';}}
async function start(testId,tests){const t=(tests||[]).find(x=>String(x['Test ID'])===String(testId));if(!t)return document.getElementById('app').innerHTML='<div class="card danger">Test not found.</div>';const q=await post({action:'libraryPublishedMockQuestions',token:T,testId:testId});if(!q.success)return document.getElementById('app').innerHTML='<div class="card danger">❌ '+esc(q.message)+'</div>';document.getElementById('top').innerHTML='<b>'+esc(t.Title)+'</b><br>'+esc(t.Course)+' — '+esc(t['Subject Name'])+' • '+esc(t.Duration)+' min';let remaining=Math.max(1,Number(t.Duration||30))*60,submitted=false;const timer=setInterval(()=>{remaining--;const el=document.getElementById('timer');if(el)el.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining<=0){clearInterval(timer);submit();}},1000);document.getElementById('app').innerHTML='<div class="card"><b>Time:</b> <span id="timer">'+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')+'</span></div>'+(q.questions||[]).map((x,i)=>'<div class="card"><h3>Q'+(i+1)+'. '+esc(x.Question)+'</h3>'+['A','B','C','D'].map(k=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+k+'"> <b>'+k+'.</b> '+esc(x['Option '+k])+'</label>').join('')+'</div>').join('')+'<div class="card"><button id="submitBtn">✅ Submit Test</button><div id="result"></div></div>';document.getElementById('submitBtn').onclick=submit;
async function submit(){if(submitted)return;submitted=true;clearInterval(timer);const answers=(q.questions||[]).map((_,i)=>{const el=document.querySelector('input[name="q'+i+'"]:checked');return el?el.value:''});const r=await post({action:'submitLibraryMockTest',token:T,testId:testId,answers:answers});const box=document.getElementById('result');if(!r.success){box.className='danger';box.textContent='❌ '+(r.message||'Submit failed');submitted=false;return;}box.innerHTML='<h2>Result: '+esc(r.result.result)+'</h2><p>Score: '+esc(r.result.score)+' / '+esc(r.result.totalMarks)+' • '+esc(r.result.percentage)+'% • Grade '+esc(r.result.grade)+'</p><a class="btn" href="library-mock-test.html">Back to Library Mock Tests</a>';}}
load();
</script></body></html>
