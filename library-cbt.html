<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surya Digital Library — CBT Examination</title>
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d7dce5;--brand:#1f4f8f;--ok:#2ea05a;--bad:#ca463c;--mark:#7b43be;--idle:#969ca8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--muted:#9aa6bd;--line:#2b3957;--brand:#4a86d8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{font-size:1.25rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 6px}
.muted{color:var(--muted)}.danger{color:var(--bad)}
.btn{display:inline-block;padding:11px 16px;border-radius:10px;border:0;background:var(--brand);color:#fff;cursor:pointer;font-size:1rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.warn{background:var(--mark)}.btn.good{background:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;background:var(--card);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.timer{font-weight:700;font-size:1.2rem;color:#e67e22}
.layout{display:grid;grid-template-columns:1fr 250px;gap:12px}
@media (max-width:760px){.layout{grid-template-columns:1fr}.pal-side{order:2}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:8px 0;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt.sel{border-color:var(--brand);background:rgba(31,79,143,.10)}
.opt b{min-width:24px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pn{padding:10px 0;border-radius:8px;border:0;color:#fff;font-weight:700;cursor:pointer;background:var(--idle)}
.pn.ans{background:var(--ok)}.pn.nans{background:var(--bad)}.pn.mrk{background:var(--mark)}.pn.cur{outline:3px solid var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;margin-top:10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%}
.rv{border-left:5px solid var(--line);padding:8px 12px;margin:10px 0;background:rgba(127,127,127,.06);border-radius:8px}
.rv.right{border-color:var(--ok)}.rv.wrong{border-color:var(--bad)}
.hidden{display:none}
</style>
<script src="assets/js/backend-config.js"></script>
</head>
<body>
<div id="bar" class="bar hidden"></div>
<main class="wrap">
  <div id="app"><div class="card">⏳ Loading CBT...</div></div>
</main>
<div id="modalHost"></div>

<script>
(function(){
'use strict';
var API=window.SURYA_DATABASE_API;
var T=sessionStorage.getItem('SURYA_LIBRARY_TOKEN');
if(!T){location.replace('library-login.html');return;}

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];});}

async function post(data){
  var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
  var raw=await r.text();
  if(!r.ok)throw new Error('Server error '+r.status);
  var j;
  try{j=JSON.parse(raw);}catch(e){throw new Error('Server से सही जवाब नहीं मिला: '+raw.slice(0,140));}
  if(j&&j.authenticated===false){
    sessionStorage.removeItem('SURYA_LIBRARY_TOKEN');
    throw new Error('Library login की जरूरत है. दोबारा login करें.');
  }
  return j;
}

function showError(msg,backLabel){
  $('bar').classList.add('hidden');
  $('app').innerHTML='<div class="card"><h2 class="danger">❌ Problem</h2><p>'+esc(msg)+'</p>'
    +'<div class="row"><a class="btn" href="library-cbt.html">← CBT list</a> <a class="btn ghost" href="library-dashboard.html">📚 Library Dashboard</a>'
    +(/login/i.test(msg)?' <a class="btn ghost" href="library-login.html">🔐 Login</a>':'')+'</div></div>';
}

/* ---------- state ---------- */
var tests=[],test=null,qs=[],ans=[],marked=[],visited=[],cur=0,endAt=0,timer=null,submitted=false,active=false;
function skey(){return 'CBT_'+(test?test['Test ID']:'');}
function persist(){try{sessionStorage.setItem(skey(),JSON.stringify({endAt:endAt,ans:ans,marked:marked}));}catch(e){}}

/* ---------- list ---------- */
async function loadList(){
  var raw=await post({action:'libraryPublishedCBTExams',token:T});
  var list=Array.isArray(raw)?{success:true,tests:raw}:raw;
  if(!list.success)throw new Error(list.message||'Session expired. Please login again.');
  tests=list.tests||[];
}
function renderList(){
  $('bar').classList.add('hidden');
  var h='<div class="card"><h1>🖥️ Digital Library CBT Examination</h1><div class="muted">असली exam जैसा Computer Based Test</div>'
    +'<div class="row"><a class="btn ghost" href="library-dashboard.html">← Library Dashboard</a></div></div>';
  if(!tests.length)h+='<div class="card">अभी कोई published library CBT examination नहीं है.</div>';
  tests.forEach(function(t){
    var paid=String(t.accessMode||'').toUpperCase()==='PAID',unlock=String(t.accessState||'').toUpperCase()==='UNLOCKED';
    h+='<div class="card"><h2>'+esc(t.Title)+'</h2><div class="muted">'+esc(t.Course)+' — '+esc(t['Subject Name'])+'</div>'
      +'<p>⏱ '+esc(t.Duration)+' min • 📝 '+esc(t['Total Marks'])+' marks • '
      +(paid?(unlock?'✅ Paid access unlocked':'🔒 Paid — membership payment required'):'🟢 Free')+'</p>'
      +((paid&&!unlock)?'':'<a class="btn" href="library-cbt.html?testId='+encodeURIComponent(t['Test ID'])+'">Open CBT Examination</a>')+'</div>';
  });
  $('app').innerHTML=h;
}

/* ---------- instructions ---------- */
function renderInstructions(t){
  $('bar').classList.add('hidden');
  var dur=Math.max(1,Number(t.Duration||30));
  $('app').innerHTML='<div class="card"><h1>'+esc(t.Title)+'</h1><div class="muted">'+esc(t.Course)+' — '+esc(t['Subject Name'])+'</div></div>'
   +'<div class="card"><h2>📋 निर्देश (Instructions)</h2><ol style="line-height:1.7;padding-left:20px">'
   +'<li>कुल समय: <b>'+dur+' मिनट</b>. START दबाते ही timer चालू हो जाएगा और रुकेगा नहीं.</li>'
   +'<li>Time पूरा होते ही exam अपने आप submit हो जाएगा.</li>'
   +'<li><b>Question Palette</b> से किसी भी question पर जा सकते हैं.</li>'
   +'<li><span class="dot" style="background:var(--ok)"></span>Answered &nbsp;<span class="dot" style="background:var(--bad)"></span>Not answered &nbsp;<span class="dot" style="background:var(--mark)"></span>Marked for review &nbsp;<span class="dot" style="background:var(--idle)"></span>Not visited</li>'
   +'<li>Marked for review वाले answered questions भी जाँचे जाएंगे.</li>'
   +'<li>ये CBT exam <b>सिर्फ़ एक बार</b> दिया जा सकता है. Submit के बाद answers बदले नहीं जा सकते.</li>'
   +'<li>Page refresh करने पर आपके answers और बचा हुआ समय सुरक्षित रहेंगे.</li></ol>'
   +'<div class="row"><button class="btn good" id="startBtn">▶ START EXAM</button> <a class="btn ghost" href="library-cbt.html">← Back</a></div>'
   +'<div id="startMsg" class="danger" style="margin-top:10px"></div></div>';
  $('startBtn').onclick=function(){startExam(t);};
}

/* ---------- exam ---------- */
async function startExam(t){
  var btn=$('startBtn');btn.disabled=true;btn.textContent='⏳ Questions load हो रहे हैं...';
  try{
    var q=await post({action:'libraryPublishedCBTQuestions',token:T,testId:t['Test ID']});
    if(!q.success)throw new Error(q.message||'Questions load नहीं हुए.');
    qs=q.questions||[];
    if(!qs.length)throw new Error('इस exam में अभी कोई question नहीं है.');
    test=t;
    var dur=Math.max(1,Number(t.Duration||30))*60*1000;
    ans=qs.map(function(){return '';});marked=qs.map(function(){return false;});visited=qs.map(function(){return false;});
    endAt=Date.now()+dur;
    try{
      var sv=JSON.parse(sessionStorage.getItem(skey())||'null');
      if(sv&&sv.endAt>Date.now()&&sv.ans&&sv.ans.length===qs.length){endAt=sv.endAt;ans=sv.ans;marked=sv.marked||marked;}
    }catch(e){}
    cur=0;submitted=false;active=true;
    persist();
    buildExam();
    tick();timer=setInterval(tick,1000);
  }catch(e){
    btn.disabled=false;btn.textContent='▶ START EXAM';
    $('startMsg').textContent='❌ '+e.message;
  }
}

function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function tick(){
  var left=Math.max(0,Math.round((endAt-Date.now())/1000));
  var el=$('timer');if(el){el.textContent='⏱ '+fmt(left);el.style.color=left<=60?'#d92d20':'';}
  if(left<=0&&!submitted){clearInterval(timer);doSubmit(true);}
}

function buildExam(){
  var bar=$('bar');bar.classList.remove('hidden');
  bar.innerHTML='<div><b>'+esc(test.Title)+'</b><div class="muted" style="font-size:.8rem">'+esc(test.Course)+' — '+esc(test['Subject Name'])+'</div></div><div id="timer" class="timer">⏱ --:--</div>';
  $('app').innerHTML='<div class="layout"><div id="qside"></div><div class="pal-side"><div class="card"><h2>Question Palette</h2><div id="pal" class="grid"></div>'
    +'<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>Answered</span><span><i class="dot" style="background:var(--bad)"></i>Not answered</span><span><i class="dot" style="background:var(--mark)"></i>Marked</span><span><i class="dot" style="background:var(--idle)"></i>Not visited</span></div>'
    +'<div class="row"><button class="btn warn" id="submitBtn" style="width:100%">✅ SUBMIT EXAM</button></div></div></div></div>';
  $('submitBtn').onclick=confirmSubmit;
  renderQ();
}

function renderQ(){
  visited[cur]=true;
  var x=qs[cur];
  var h='<div class="card"><div class="muted">Question '+(cur+1)+' / '+qs.length+(marked[cur]?' &nbsp; 🚩 Marked for review':'')+'</div>'
    +'<h2 style="margin-top:6px;line-height:1.5">'+(cur+1)+'. '+esc(x.Question)+'</h2>';
  ['A','B','C','D'].forEach(function(k){
    var t=x['Option '+k];
    if(t==null||String(t).trim()==='')return;
    h+='<div class="opt'+(ans[cur]===k?' sel':'')+'" data-k="'+k+'"><b>'+k+'.</b><span>'+esc(t)+'</span></div>';
  });
  h+='<div class="row"><button class="btn warn" id="bMark">🚩 Mark &amp; Next</button><button class="btn ghost" id="bClear">✖ Clear</button></div>'
    +'<div class="row"><button class="btn ghost" id="bPrev"'+(cur===0?' disabled':'')+'>← Previous</button><button class="btn" id="bNext">'+(cur===qs.length-1?'Save &amp; Review':'Save &amp; Next →')+'</button></div></div>';
  $('qside').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(el){
    el.onclick=function(){ans[cur]=el.getAttribute('data-k');persist();renderQ();renderPal();};
  });
  $('bMark').onclick=function(){marked[cur]=true;persist();next();};
  $('bClear').onclick=function(){ans[cur]='';persist();renderQ();renderPal();};
  $('bPrev').onclick=function(){if(cur>0){cur--;renderQ();}};
  $('bNext').onclick=function(){marked[cur]=false;persist();next();};
  renderPal();
  window.scrollTo(0,0);
}
function next(){if(cur<qs.length-1){cur++;renderQ();}else{renderQ();confirmSubmit();}}

function renderPal(){
  var h='';
  qs.forEach(function(_,i){
    var c='pn';
    if(marked[i])c+=' mrk';else if(ans[i])c+=' ans';else if(visited[i])c+=' nans';
    if(i===cur)c+=' cur';
    h+='<button class="'+c+'" data-i="'+i+'">'+(i+1)+((marked[i]&&ans[i])?'✓':'')+'</button>';
  });
  $('pal').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.pn'),function(b){b.onclick=function(){cur=Number(b.getAttribute('data-i'));renderQ();};});
}

/* ---------- submit ---------- */
function closeModal(){$('modalHost').innerHTML='';}
function confirmSubmit(){
  var a=0,m=0;
  qs.forEach(function(_,i){if(ans[i])a++;if(marked[i])m++;});
  $('modalHost').innerHTML='<div class="modal"><div class="box"><h2>Final Submit</h2>'
    +'<p>✅ Answered: <b>'+a+'</b><br>❌ Not answered: <b>'+(qs.length-a)+'</b><br>🚩 Marked for review: <b>'+m+'</b></p>'
    +'<p class="muted">Submit के बाद answers बदले नहीं जा सकते.</p>'
    +'<div class="row"><button class="btn good" id="yesSubmit">SUBMIT</button><button class="btn ghost" id="noSubmit">BACK TO EXAM</button></div></div></div>';
  $('yesSubmit').onclick=function(){closeModal();doSubmit(false);};
  $('noSubmit').onclick=closeModal;
}

async function doSubmit(auto){
  if(submitted)return;
  submitted=true;clearInterval(timer);
  $('bar').classList.add('hidden');
  $('app').innerHTML='<div class="card">⏳ '+(auto?'Time पूरा हुआ — ':'')+'Answers submit हो रहे हैं...</div>';
  try{
    var r=await post({action:'submitLibraryCBTExam',token:T,testId:test['Test ID'],answers:ans});
    if(!r.success)throw new Error(r.message||'Submit failed');
    active=false;
    try{sessionStorage.removeItem(skey());}catch(e){}
    showResult(r.result);
  }catch(e){
    submitted=false;
    $('app').innerHTML='<div class="card"><h2 class="danger">❌ Submit नहीं हो पाया</h2><p>'+esc(e.message)+'</p>'
      +'<p class="muted">आपके answers इस page पर सुरक्षित हैं. Internet check करके दोबारा try करें.</p>'
      +'<div class="row"><button class="btn" id="retry">🔁 Retry Submit</button></div></div>';
    $('retry').onclick=function(){doSubmit(auto);};
  }
}

function showResult(res){
  var pass=String(res.result).toUpperCase()==='PASS';
  var h='<div class="card"><h1>'+(pass?'🎉':'📘')+' CBT Result: <span style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+esc(res.result)+'</span></h1>'
   +'<p style="font-size:1.1rem">Score: <b>'+esc(res.score)+' / '+esc(res.totalMarks)+'</b> • '+esc(res.percentage)+'% • Grade '+esc(res.grade)+'</p>'
   +'<div class="row"><a class="btn" href="library-cbt.html">← CBT list</a> <a class="btn ghost" href="library-dashboard.html">📚 Library Dashboard</a></div></div>';
  var rv=res.review||[];
  if(rv.length){
    h+='<div class="card"><h2>📝 Answer Review</h2>';
    rv.forEach(function(x,i){
      var right=x.yourAnswer&&x.yourAnswer===x.correctAnswer;
      h+='<div class="rv '+(right?'right':'wrong')+'"><b>Q'+(i+1)+'. '+esc(x.question)+'</b><br>'
        +'आपका answer: <b>'+esc(x.yourAnswer||'— (छोड़ा)')+'</b> • सही answer: <b>'+esc(x.correctAnswer)+'</b> '+esc(x.correctText||'')
        +' • '+esc(x.awarded)+'/'+esc(x.marks)+'</div>';
    });
    h+='</div>';
  }
  $('app').innerHTML=h;
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload',function(e){if(active&&!submitted){e.preventDefault();e.returnValue='';}});

/* ---------- boot ---------- */
(async function(){
  try{
    await loadList();
    var id=new URLSearchParams(location.search).get('testId');
    if(!id){renderList();return;}
    var t=tests.find(function(x){return String(x['Test ID'])===String(id);});
    if(!t)throw new Error('यह CBT exam नहीं मिला या आपके लिए available नहीं है.');
    var paid=String(t.accessMode||'').toUpperCase()==='PAID',unlock=String(t.accessState||'').toUpperCase()==='UNLOCKED';
    if(paid&&!unlock)throw new Error('यह paid CBT है. Library membership payment/verification के बाद खुलेगा.');
    renderInstructions(t);
  }catch(e){showError(e.message||String(e));}
})();
})();
</script>
</body>
</html>
