<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO Financial Panel | SURYA</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/project-ui.css"><link rel="stylesheet" href="assets/css/dark-mode-fix.css"><script src="assets/js/surya-format.js"></script>
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
</head><body><main style="max-width:1100px;margin:30px auto;padding:16px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>🔐 CEO / Financial Panel</h1><p>Gmail OTP protected finance area.</p></div><a href="admin.html" class="admin-btn">← Admin Dashboard</a></div><section id="verifyBox" style="max-width:520px;margin:30px auto;padding:24px;border-radius:16px;background:var(--card-bg,#fff);box-shadow:0 8px 30px rgba(0,0,0,.12)"><h2>CEO Verification</h2><p id="msg">पहले authorized CEO Gmail पर OTP भेजें।</p><button id="send" class="admin-btn" type="button">📧 Send Gmail OTP</button><div id="otpArea" hidden><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" style="width:100%;box-sizing:border-box;padding:12px;margin:14px 0"><button id="verify" class="admin-btn" type="button">🔓 Verify OTP</button></div></section><section id="panel" hidden><div id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px"></div><div style="margin-top:24px;padding:18px;border-radius:14px;background:var(--card-bg,#fff);box-shadow:0 6px 20px rgba(0,0,0,.1)"><h2>Recent Verified Payments</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Account</th><th>Amount</th><th>Mode</th><th>Receipt</th><th>Date</th></tr></thead><tbody id="payments"></tbody></table></div></div><div style="margin-top:20px"><button id="lock" type="button" style="padding:12px 16px;border:0;border-radius:10px;background:#9b1c1c;color:#fff;font-weight:700">🚨 Emergency Lock Admin 24 Hours</button></div></section></main><script src="assets/js/backend-config.js"></script><script src="assets/js/admin-guard.js"></script><script>
const API=window.SURYA_DATABASE_API,TOKEN=sessionStorage.getItem("SURYA_ADMIN_TOKEN");let CEO_TOKEN="";
async function call(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token:TOKEN})});return r.json();}
const $=id=>document.getElementById(id);function money(v){return "₹"+Number(v||0).toLocaleString("en-IN");}
$("send").onclick=async()=>{ $("send").disabled=true;$("msg").textContent="⏳ OTP भेजा जा रहा है...";try{const d=await call({action:"ceoRequestOtp"});if(d.success){$("otpArea").hidden=false;$("msg").textContent="✅ OTP authorized CEO Gmail पर भेज दिया गया है.";}else $("msg").textContent="❌ "+(d.message||"OTP भेजना failed");}catch(e){$("msg").textContent="❌ Server error";}finally{$("send").disabled=false;}};
$("verify").onclick=async()=>{const otp=$("otp").value.trim();if(!/^\d{6}$/.test(otp)){ $("msg").textContent="❌ 6 digit OTP डालें.";return;}const d=await call({action:"ceoVerifyOtp",otp});if(!d.success){$("msg").textContent="❌ "+(d.message||"Invalid OTP");return;}CEO_TOKEN=d.ceoToken;$("verifyBox").hidden=true;$("panel").hidden=false;loadFinance();};
async function loadFinance(){const d=await call({action:"ceoFinancialSummary",ceoToken:CEO_TOKEN});if(!d.success){alert(d.message||"CEO session expired");location.reload();return;}const s=d.summary;const items=[['Course Expected',s.course.expected],['Course Collected',s.course.collected],['Course Pending',s.course.pending],['Library Expected',s.library.expected],['Library Collected',s.library.collected],['Library Pending',s.library.pending],['Total Collected',s.total.collected],['Total Pending',s.total.pending],['Cash',s.total.cash],['UPI',s.total.upi]];$("cards").innerHTML=items.map(x=>`<div style="padding:18px;border-radius:14px;background:var(--card-bg,#fff);box-shadow:0 5px 18px rgba(0,0,0,.1)"><small>${x[0]}</small><h2 style="margin:6px 0">${money(x[1])}</h2></div>`).join('');$("payments").innerHTML=(s.payments||[]).map(p=>`<tr><td>${String(p.accountType)} / ${String(p.accountId)}</td><td>${money(p.amount)}</td><td>${String(p.mode)}</td><td>${String(p.receiptNumber||'—')}</td><td>${formatSuryaDateTime(p.date)}</td></tr>`).join('');}
$("lock").onclick=async()=>{if(!confirm("CEO authorization ke baad Admin login 24 hours ke liye lock hoga. Continue?"))return;const d=await call({action:"ceoEmergencyLock",ceoToken:CEO_TOKEN});alert(d.message||"Done");if(d.success)location.href="admin-login.html";};
</script><script src="assets/js/project-ui.js"></script>
</body></html>
