<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/images/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">

<title>Study Materials Management</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/project-ui.css">
<link rel="stylesheet" href="assets/css/dark-mode-fix.css">
<link rel="stylesheet" href="AERON/css/aeron.css">

<style>
.wrap{
    max-width:1000px;
    margin:30px auto;
    padding:18px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    margin:15px 0;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.grid input,
.grid textarea,
.grid select{
    padding:11px;
    width:100%;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
}

.grid textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    padding:10px 16px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

.msg{
    font-weight:600;
    margin-top:10px;
}

.file-info{
    margin-top:8px;
    font-size:14px;
}

.pdf-link{
    display:inline-block;
    margin-top:8px;
    text-decoration:none;
}
</style>

<script src="assets/js/backend-config.js"></script>
<script src="assets/js/admin-guard.js"></script>

<script src="assets/js/surya-format.js"></script>
</head>

<body>

<main class="wrap">

<h2>📚 Study Materials Management</h2>

<div class="card">

    <div class="grid">

        <input
            id="materialId"
            placeholder="Material ID (blank = new)"
        >

        <input
            id="materialTitle"
            placeholder="PDF title"
        >

        <div style="grid-column:1/-1">

    <label style="display:block;font-weight:600;margin-bottom:8px">
        👥 Target Audience
    </label>

    <div style="display:flex;gap:16px;flex-wrap:wrap">

        <label>
            <input
                type="radio"
                name="materialAudience"
                value="COMPUTER"
                checked
                onchange="updateMaterialAudienceUI()"
            >
            💻 Computer Students
        </label>

        <label>
            <input
                type="radio"
                name="materialAudience"
                value="LIBRARY"
                onchange="updateMaterialAudienceUI()"
            >
            📚 Library Students
        </label>

        <label>
            <input
                type="radio"
                name="materialAudience"
                value="BOTH"
                onchange="updateMaterialAudienceUI()"
            >
            💻📚 Both
        </label>

    </div>

</div>

<div
    id="materialTargetBox"
    style="grid-column:1/-1"
>

    <label
        style="display:block;font-weight:600;margin-bottom:8px"
    >
        🎓 Target Courses & Subjects
    </label>

    <div
        id="materialTargetMappings"
        style="display:flex;flex-direction:column;gap:10px"
    ></div>

    <button
        type="button"
        class="btn"
        onclick="addMaterialTargetMapping()"
    >
        ➕ Add Course
    </button>

</div>

<!-- Legacy fields: temporarily kept hidden for backward compatibility -->
<input
    id="materialCourse"
    type="hidden"
>

<input
    id="materialSubject"
    type="hidden"
>

        <textarea
            id="materialDescription"
            placeholder="Description"
        ></textarea>

        <select id="materialStatus">
            <option value="Draft">Draft</option>
            <option value="Published">Published</option>
        </select>

        <select id="materialAccessMode">
            <option value="FREE">FREE — सब students</option>
            <option value="PAID">PAID — payment required</option>
        </select>

        <input
            id="materialFile"
            type="file"
            accept="application/pdf"
        >

    </div>

    <div class="file-info">
        📄 केवल PDF | अधिकतम 10 MB
    </div>

    <button
        class="btn"
        onclick="saveStudyMaterial()">
        💾 Save
    </button>

    <button
        class="btn"
        onclick="clearStudyForm()">
        🧹 Clear
    </button>

    <div id="msg" class="msg"></div>

</div>

<div id="list"></div>

</main>

<script>

const API =
    window.SURYA_DATABASE_API;

const token =
    sessionStorage.getItem("SURYA_ADMIN_TOKEN");

const auth =
    sessionStorage.getItem("SURYA_ADMIN_AUTH");

if (auth !== "true" || !token) {
    location.replace("admin-login.html");
}

const $ = id =>
    document.getElementById(id);
  let studySubjects = [];

let materialTargetMappings = [];

function getMaterialAudience() {

    const selected =
        document.querySelector(
            'input[name="materialAudience"]:checked'
        );

    return selected
        ? selected.value
        : "COMPUTER";
}

function updateMaterialAudienceUI() {

    const audience =
        getMaterialAudience();

    const box =
        $("materialTargetBox");

    if (!box) {
        return;
    }

    box.style.display =
        audience === "LIBRARY"
            ? "none"
            : "block";
}

function addMaterialTargetMapping(
    existingCourse = "",
    existingSubjects = []
) {

    const container =
        $("materialTargetMappings");

    if (!container) {
        return;
    }

    const row =
        document.createElement("div");

    row.className =
        "material-target-row";

    row.style.display = "grid";
    row.style.gridTemplateColumns =
        "1fr 1fr auto";
    row.style.gap = "10px";
    row.style.alignItems = "start";

    row.innerHTML = `

        <select class="material-target-course">
            <option value="">Select Course</option>
        </select>

        <select
            class="material-target-subjects"
            multiple
            size="4"
        >
            <option value="">
                Select Course first
            </option>
        </select>

        <button
            type="button"
            class="btn"
            onclick="this.parentElement.remove()"
        >
            🗑️
        </button>

    `;

    container.appendChild(row);

    const courseSelect =
        row.querySelector(
            ".material-target-course"
        );

    const subjectSelect =
        row.querySelector(
            ".material-target-subjects"
        );

    fillMaterialTargetCourses(
        courseSelect,
        existingCourse
    );

    courseSelect.addEventListener(
        "change",
        function() {

            fillMaterialTargetSubjects(
                courseSelect,
                subjectSelect
            );

        }
    );

    if (existingCourse) {

        fillMaterialTargetSubjects(
            courseSelect,
            subjectSelect,
            existingSubjects
        );

    }
}

function fillMaterialTargetCourses(
    select,
    selectedCourse = ""
) {

    const courses = [
        ...new Set(
            studySubjects
                .map(x =>
                    String(
                        x.course ||
                        x.Course ||
                        ""
                    ).trim()
                )
                .filter(Boolean)
        )
    ];

    select.innerHTML =
        '<option value="">Select Course</option>' +
        courses.map(course =>
            `<option value="${esc(course)}"${
                String(course).toLowerCase() ===
                String(selectedCourse).toLowerCase()
                    ? " selected"
                    : ""
            }>${esc(course)}</option>`
        ).join("");

}

function fillMaterialTargetSubjects(
    courseSelect,
    subjectSelect,
    selectedSubjects = []
) {

    const course =
        String(
            courseSelect.value || ""
        ).trim().toLowerCase();

    const selected =
        new Set(
            (selectedSubjects || [])
                .map(x =>
                    String(x)
                        .trim()
                        .toLowerCase()
                )
        );

    if (!course) {

        subjectSelect.innerHTML =
            '<option value="">Select Course first</option>';

        return;
    }

    const subjects =
        studySubjects.filter(x =>
            String(
                x.course ||
                x.Course ||
                ""
            )
                .trim()
                .toLowerCase() === course
        );

    subjectSelect.innerHTML =
        subjects.map(x => {

            const id =
                String(
                    x.subjectId ||
                    x["Subject ID"] ||
                    ""
                ).trim();

            const name =
                String(
                    x.subjectName ||
                    x["Subject Name"] ||
                    id
                ).trim();

            return `
                <option
                    value="${esc(id)}"
                    ${selected.has(id.toLowerCase())
                        ? "selected"
                        : ""}
                >
                    ${esc(id)} — ${esc(name)}
                </option>
            `;

        }).join("");

}

function esc(v) {
    return String(v ?? "").replace(
        /[&<>"']/g,
        m => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[m])
    );
}

async function api(body) {

    const r = await fetch(API, {
        method:"POST",
        headers:{
            "Content-Type":
                "text/plain;charset=utf-8"
        },
        body:JSON.stringify({
            ...body,
            token
        })
    });

    const d = await r.json();

    if (!d.success) {
        throw new Error(
            d.message || "Request failed."
        );
    }

    return d;
}
async function api(body) {

    const r = await fetch(API, {
        method:"POST",
        headers:{
            "Content-Type":
                "text/plain;charset=utf-8"
        },
        body:JSON.stringify({
            ...body,
            token
        })
    });

    const d = await r.json();

    if (!d.success) {
        throw new Error(
            d.message || "Request failed."
        );
    }

    return d;
}
  
async function loadStudySubjects() {

    try {

        const d = await api({
            action: "courseSubjects"
        });

        studySubjects =
            d.subjects ||
            d.courseSubjects ||
            [];

        updateMaterialAudienceUI();

        const container =
            $("materialTargetMappings");

        if (
            container &&
            !container.children.length &&
            getMaterialAudience() !== "LIBRARY"
        ) {
            addMaterialTargetMapping();
        }

    } catch (e) {

        console.error(
            "Course Subjects load failed:",
            e
        );

        $("msg").textContent =
            "❌ Course/Subject list load नहीं हुई: " +
            e.message;
    }
}

function readFileAsDataURL(file) {

    return new Promise((resolve,reject) => {

        const reader =
            new FileReader();

        reader.onload = () =>
            resolve(reader.result);

        reader.onerror = () =>
            reject(
                new Error(
                    "PDF could not be read."
                )
            );

        reader.readAsDataURL(file);
    });
}

async function saveStudyMaterial() {

    const file =
        $("materialFile").files[0];
    const audience =
    getMaterialAudience();

const targetCourseSubjects = [];

if (audience !== "LIBRARY") {

    document
        .querySelectorAll(".material-target-row")
        .forEach(function(row) {

            const courseSelect =
                row.querySelector(
                    ".material-target-course"
                );

            const subjectSelect =
                row.querySelector(
                    ".material-target-subjects"
                );

            const course =
                String(
                    courseSelect?.value || ""
                ).trim();

            const subjects =
                Array.from(
                    subjectSelect?.selectedOptions || []
                )
                .map(function(option) {
                    return String(
                        option.value || ""
                    ).trim();
                })
                .filter(Boolean);

            if (course) {
                targetCourseSubjects.push({
                    course: course,
                    subjects: subjects
                });
            }

        });
}

    const data = {

        materialId:
            $("materialId").value.trim(),

        title:
            $("materialTitle").value.trim(),

        course:
            $("materialCourse").value.trim(),

        subject:
            $("materialSubject").value.trim(),

        description:
            $("materialDescription").value.trim(),

        status:
            $("materialStatus").value,

        accessMode:
            $("materialAccessMode").value,
        audience:
    audience,

targetCourseSubjects:
    targetCourseSubjects,

        pdf:null,
        fileName:"",
        mimeType:"application/pdf"
    };

    if (!data.title) {
        $("msg").textContent =
            "❌ PDF title required.";
        return;
    }

    if (!data.materialId && !file) {
        $("msg").textContent =
            "❌ New material के लिए PDF चुनें.";
        return;
    }

    if (file) {

        if (
            file.type !==
            "application/pdf"
        ) {
            $("msg").textContent =
                "❌ केवल PDF file allowed.";
            return;
        }

        if (
            file.size >
            10 * 1024 * 1024
        ) {
            $("msg").textContent =
                "❌ PDF 10 MB से बड़ी है.";
            return;
        }

        try {
            $("msg").textContent =
                "⏳ PDF पढ़ी जा रही है...";

            data.pdf =
                await readFileAsDataURL(file);

            data.fileName =
                file.name;

        } catch (e) {
            $("msg").textContent =
                "❌ " + e.message;
            return;
        }
    }

    try {

        $("msg").textContent =
            "⏳ Saving...";

        const saveAction =
            data.materialId
                ? "studyUpdate"
                : "studyUpload";

        await api({
            action: saveAction,
            ...data
        });

        $("msg").textContent =
            "✅ Study material saved.";

        clearStudyForm();

        await loadStudyMaterials();

    } catch (e) {

        $("msg").textContent =
            "❌ " + e.message;
    }
}

async function loadStudyMaterials() {

    try {

        const d = await api({
            action:"studyAdminList"
        });

        const materials =
            d.materials || [];

        if (!materials.length) {

            $("list").innerHTML =
                '<div class="card">' +
                '📚 अभी कोई Study Material नहीं है.' +
                '</div>';

            return;
        }

        $("list").innerHTML =
            materials.map(m => {

                const id =
                    esc(m["Material ID"]);

                const title =
                    esc(m.Title);

                const course =
                    esc(m.Course || "All");

                const subject =
                    esc(m.Subject || "—");

                const status =
                    esc(m.Status);

                const description =
                    esc(m.Description || "");

                const audience =
                    String(
                        m.Audience || "COMPUTER"
                    )
                    .trim()
                    .toUpperCase();

                const audienceLabel =
                    audience === "LIBRARY"
                        ? "📚 Library Students"
                        : audience === "BOTH"
                            ? "💻📚 Computer + Library Students"
                            : "💻 Computer Students";

                let targetMappings = [];

                try {

                    const raw =
                        m["Target Course Subjects"];

                    if (raw) {

                        targetMappings =
                            typeof raw === "string"
                                ? JSON.parse(raw)
                                : raw;

                    }

                } catch (e) {

                    targetMappings = [];

                }

                let targetText = "";

                if (
                    Array.isArray(targetMappings) &&
                    targetMappings.length
                ) {

                    targetText =
                        targetMappings.map(item => {

                            const c =
                                String(
                                    item.course || ""
                                ).trim();

                            const subjects =
                                Array.isArray(item.subjects)
                                    ? item.subjects
                                    : [];

                            return (
                                esc(c) +
                                (
                                    subjects.length
                                        ? " → " +
                                          subjects
                                            .map(s => esc(s))
                                            .join(", ")
                                        : ""
                                )
                            );

                        }).join("<br>");

                } else if (audience === "LIBRARY") {

                    targetText =
                        "📚 Library only";

                } else {

                    targetText =
                        esc(course) +
                        (
                            subject !== "—"
                                ? " → " + esc(subject)
                                : ""
                        );

                }

                const url =
                    m["File ID"]
                    ? "https://drive.google.com/file/d/" +
                      encodeURIComponent(
                          String(m["File ID"])
                      ) +
                      "/view"
                    : "";

                return `
                <div class="card">

                    <b>${id}</b>
                    — <strong>${title}</strong>

                    <br>
                    👥 Audience:
                    <strong>${audienceLabel}</strong>

                    <br>
                    🎓 Target Course / Subject:
                    <br>
                    ${targetText}

                    <br>
                    🔘 Status: ${status}

                    ${description
                        ? `<br>📝 ${description}`
                        : ""}

                    <br>

                    ${
                        url
                        ? `<a
                            class="pdf-link"
                            href="${url}"
                            target="_blank"
                            rel="noopener">
                            📖 Open PDF
                           </a>`
                        : ""
                    }

                    <br>

                    <button
                        class="btn"
                        onclick='editStudyMaterial(${JSON.stringify(m)})'>
                        ✏️ Edit
                    </button>

                    <button
                        class="btn"
                        onclick='deleteStudyMaterial(${JSON.stringify(id)})'>
                        🗑️ Delete
                    </button>

                </div>
                `;

            }).join("");

    } catch (e) {

        $("list").innerHTML =
            '<div class="card">❌ ' +
            esc(e.message) +
            '</div>';
    }
}

function editStudyMaterial(m) {

    $("materialId").value =
        m["Material ID"] || "";

    $("materialTitle").value =
        m.Title || "";

    $("materialCourse").value =
        m.Course || "";

    $("materialSubject").value =
        m.Subject || "";

    $("materialDescription").value =
        m.Description || "";

    $("materialStatus").value =
        m.Status || "Draft";

    $("materialAccessMode").value =
        String(
            m["Access Mode"] || "FREE"
        ).toUpperCase() === "PAID"
            ? "PAID"
            : "FREE";

    const audience =
        String(
            m.Audience || "COMPUTER"
        ).toUpperCase();

    const audienceRadio =
        document.querySelector(
            'input[name="materialAudience"][value="' +
            audience +
            '"]'
        );

    if (audienceRadio) {
        audienceRadio.checked = true;
    }

    updateMaterialAudienceUI();

    const container =
        $("materialTargetMappings");

    container.innerHTML = "";

    let mappings = [];

    try {

        const raw =
            m["Target Course Subjects"];

        if (raw) {
            mappings =
                typeof raw === "string"
                    ? JSON.parse(raw)
                    : raw;
        }

    } catch (e) {

        console.warn(
            "Target mapping parse failed:",
            e
        );

        mappings = [];
    }

    if (
        audience !== "LIBRARY" &&
        Array.isArray(mappings) &&
        mappings.length
    ) {

        mappings.forEach(function(item) {

            addMaterialTargetMapping(
                item.course || "",
                Array.isArray(item.subjects)
                    ? item.subjects
                    : []
            );

        });

    } else if (audience !== "LIBRARY") {

        addMaterialTargetMapping(
            m.Course || "",
            m.Subject
                ? [m.Subject]
                : []
        );

    }

    $("materialFile").value = "";

    $("msg").textContent =
        "✏️ Edit mode: नया PDF चुनना optional है.";
}

async function deleteStudyMaterial(id) {

    if (!confirm(
        "क्या यह Study Material delete करना है?"
    )) {
        return;
    }

    try {

        $("msg").textContent =
            "⏳ Deleting...";

        await api({
            action:"studyDelete",
            materialId:id
        });

        $("msg").textContent =
            "✅ Deleted.";

        await loadStudyMaterials();

    } catch (e) {

        $("msg").textContent =
            "❌ " + e.message;
    }
}

function clearStudyForm() {

    $("materialId").value = "";
    $("materialTitle").value = "";

    $("materialCourse").value = "";
    $("materialSubject").value = "";

    $("materialDescription").value = "";

    $("materialStatus").value =
        "Draft";

    $("materialAccessMode").value =
        "FREE";

    $("materialFile").value = "";

    const computerRadio =
        document.querySelector(
            'input[name="materialAudience"][value="COMPUTER"]'
        );

    if (computerRadio) {
        computerRadio.checked = true;
    }

    updateMaterialAudienceUI();

    const container =
        $("materialTargetMappings");

    if (container) {
        container.innerHTML = "";
        addMaterialTargetMapping();
    }

    $("msg").textContent = "";
}

loadStudyMaterials();
loadStudySubjects();

</script>

<script src="assets/js/project-ui.js"></script>
</body>
</html>
