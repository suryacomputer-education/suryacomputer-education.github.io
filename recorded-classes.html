    <style>

        }

        .watch-btn {
            display: inline-block;

        }

        .empty {

        .source-badge {

<body>

            sunilkumar5757kp@gmail.com
        </a>
    </div>

    <header class="header">
        <img src="assets/images/logo.png" class="logo" alt="Logo">

        <div class="title">
            <h1>SURYA COMPUTER OF EDUCATION CENTER</h1>
            <p>Recorded Classes</p>
        </div>
    </header>

    <main class="wrap">

        <h2>🎥 Recorded Classes</h2>

        <div id="msg">Loading recorded classes...</div>

        <div id="classes"></div>

    </main>

    <script src="assets/js/backend-config.js"></script>

    <script>
        const API = window.SURYA_DATABASE_API;

        const token =
            sessionStorage.getItem("SURYA_STUDENT_TOKEN");

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, function(m) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[m];
            });
        }

        async function loadRecordedClasses() {

            const msg = document.getElementById("msg");
            const classesBox = document.getElementById("classes");

            if (!token) {
                msg.textContent =
                    "❌ Student login required.";
                return;
            }

            try {

                const response = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        action: "recordedClasses",
                        token: token
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(
                        data.message ||
                        "Unable to load recorded classes."
                    );
                }

                const classes = data.classes || [];

                if (!classes.length) {

                    msg.textContent = "";

                    classesBox.innerHTML =
                        '<div class="empty">' +
                        '🎥 अभी आपके course के लिए कोई ' +
                        'published recorded class उपलब्ध नहीं है।' +
                        '</div>';

                    return;
                }

                msg.textContent =
                    "🎥 Available Recorded Classes";

                const groups = {};

                classes.forEach(function(item) {

                    const subject =
                        String(item["Subject"] || "").trim() ||
                        "General Classes";

                    if (!groups[subject]) {
                        groups[subject] = [];
                    }

                    groups[subject].push(item);
                });

                classesBox.innerHTML =
                    Object.keys(groups).map(function(subject) {

                        const items = groups[subject];

                        return `
                            <h3 class="subject-title">
                                📖 ${esc(subject)}
                            </h3>

                            ${items.map(function(item) {

                                const title =
                                    String(
                                        item["Title"] ||
                                        "Recorded Class"
                                    );

                                const course =
                                    String(
                                        item["Course"] || ""
                                    );

                                const description =
                                    String(
                                        item["Description"] || ""
                                    );

                                const source =
                                    String(
                                        item["Source Type"] || ""
                                    );

                                const watchURL =
                                    String(
                                        item["Watch URL"] || ""
                                    );

                                return `
                                    <div class="class-card">

                                        <h3>
                                            🎬 ${esc(title)}
                                        </h3>

                                        ${
                                            course
                                            ? `
                                            <p class="class-meta">
                                                <b>Course:</b>
                                                ${esc(course)}
                                            </p>
                                            `
                                            : ""
                                        }

                                        ${
                                            source
                                            ? `
                                            <p class="class-meta">
                                                <b>Source:</b>
                                                <span class="source-badge">
                                                    ${esc(source)}
                                                </span>
                                            </p>
                                            `
                                            : ""
                                        }

                                        ${
                                            description
                                            ? `
                                            <p>
                                                ${esc(description)}
                                            </p>
                                            `
                                            : ""
                                        }

                                        ${String(item.accessMode||"FREE").toUpperCase()==="PAID" && String(item.accessState||"").toUpperCase()!=="UNLOCKED" ? `<p><b>🔒 PAID</b> — Fee payment/verification required to unlock.</p>` : (watchURL ? `
                                            <a
                                                class="watch-btn"
                                                href="${esc(watchURL)}"
                                                target="_blank"
                                                rel="noopener"
                                            >
                                                ▶️ Watch Class
                                            </a>
                                            ` : "")
                                        }

                                    </div>
                                `;

                            }).join("")}
                        `;

                    }).join("");

            } catch (error) {

                msg.textContent =
                    "❌ " +
                    (
                        error.message ||
                        "Unable to load recorded classes."
                    );
            }
        }

        loadRecordedClasses();
    </script>
