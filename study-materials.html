<h2>📚 Study Materials</h2>

<div id="msg">Loading study materials...</div>

<div id="materials"></div>

<script src="assets/js/backend-config.js"></script>

<script>
const API = window.SURYA_DATABASE_API;
const token = sessionStorage.getItem("SURYA_STUDENT_TOKEN");

function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,function(m){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[m];
    });
}

async function loadStudyMaterials(){

    const msg = document.getElementById("msg");
    const materialsBox = document.getElementById("materials");

    if(!token){
        msg.textContent = "❌ Student login required.";
        return;
    }

    try{

        const response = await fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },
            body:JSON.stringify({
                action:"studyMaterials",
                token:token
            })
        });

        const data = await response.json();

        if(!data.success){
            throw new Error(data.message || "Unable to load study materials.");
        }

        const materials = data.materials || [];

        if(!materials.length){
            msg.textContent = "";
            materialsBox.innerHTML =
                '<div class="empty">📚 अभी आपके course के लिए कोई published PDF उपलब्ध नहीं है।</div>';
            return;
        }

        msg.textContent = "📚 Available Study Materials";

        const groups = {};

        materials.forEach(function(material){

            const subject =
                String(material["Subject"] || "").trim() ||
                "General Study Material";

            if(!groups[subject]){
                groups[subject] = [];
            }

            groups[subject].push(material);
        });

        materialsBox.innerHTML = Object.keys(groups).map(function(subject){

            const items = groups[subject];

            return `
                <h3 class="subject-title">📖 ${esc(subject)}</h3>

                ${items.map(function(material){

                    const title =
                        String(material["Title"] || "Study Material");

                    const course =
                        String(material["Course"] || "");

                    const description =
                        String(material["Description"] || "");

                    const fileName =
                        String(material["File Name"] || "PDF");

                    const viewURL =
                        String(material["ViewURL"] || "");

                    return `
                        <div class="card">

                            <h3>📄 ${esc(title)}</h3>

                            ${course
                                ? `<p class="material-meta"><b>Course:</b> ${esc(course)}</p>`
                                : ""}

                            <p class="material-meta">
                                <b>PDF:</b> ${esc(fileName)}
                            </p>

                            ${description
                                ? `<p>${esc(description)}</p>`
                                : ""}

                            ${String(material.accessMode||"FREE").toUpperCase()==="PAID" && String(material.accessState||"").toUpperCase()!=="UNLOCKED"
                                ? `<p><b>🔒 PAID</b> — Fee payment/verification required to unlock.</p>`
                                : (viewURL ? `<a class="btn"
                                      href="${esc(viewURL)}"
                                      target="_blank"
                                      rel="noopener">
                                      📖 Read PDF
                                   </a>`
                                : "")
                            }

                        </div>
                    `;

                }).join("")}

            `;

        }).join("");

    }catch(error){

        msg.textContent =
            "❌ " + (error.message || "Unable to load study materials.");

    }
}

loadStudyMaterials();
</script>
