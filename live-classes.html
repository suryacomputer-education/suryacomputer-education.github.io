<script>const API=window.SURYA_DATABASE_API,token=sessionStorage.getItem('SURYA_STUDENT_TOKEN');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}async function load(){if(!token){msg.textContent='❌ Student login required.';return;}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'liveClasses',token})});const d=await r.json();if(!d.success)throw new Error(d.message);const a=d.classes||[];msg.textContent=a.length?'':'No published classes.';classes.innerHTML=a.map(c=>`<div class="card"><h3>${esc(c['Title'])}</h3><p><b>Course:</b> ${esc(c['Course'])}</p><p><b>Teacher:</b> ${esc(c['Teacher'])}</p><p><b>Date:</b> ${esc(c['Date'])} | ${esc(c['Start Time'])} - ${esc(c['End Time'])}</p><p>${esc(c['Description'])}</p>${String(c.accessMode||'FREE').toUpperCase()==='PAID' && String(c.accessState||'').toUpperCase()!=='UNLOCKED' ? '<p><b>🔒 PAID</b> — Fee payment/verification required to join.</p>' : (c['Join URL']?`<a class="btn" href="${esc(c['Join URL'])}" target="_blank" rel="noopener">🎥 Join Class</a>`:'')}</div>`).join('');}catch(e){msg.textContent='❌ '+e.message;}}load();</script>    <script src="assets/js/project-ui.js"></script>
